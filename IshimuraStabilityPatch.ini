; Ishimura Stability Patch 1.0.2
; Put this file next to Dead Space.exe and xinput1_3.dll.

[Compatibility]
; Dead Space can corrupt memory while detecting modern high-core-count CPUs.
; 1-8 are supported. 8 keeps the most performance while staying in the safe range.
CpuCoreLimit=8

[Timing]
; Keeps physics, scripts, and queued sounds inside the game's proven 60 FPS range.
PhysicsAndAudioSafety=1
MaxFPS=60

; 0 is strongly recommended. Set to 1 only if you accept high-FPS physics,
; animation, input, and sound-event bugs.
AllowUnsafeHighFPS=0

[Display]
; Changes half-refresh VSync (interval 2) to full-refresh VSync (interval 1).
; It does not force VSync on when you turn it off in-game.
FixVSync=1

; Only activates when the game itself is set to Windowed.
; The patch verifies that the client area covers the monitor and repairs later
; style or size changes made by the game.
BorderlessWindowed=1

[Graphics]
; Upgrades linear texture filtering without forcing anisotropic filtering on
; point-sampled UI/depth textures.
AnisotropicFiltering=1
MaxAnisotropy=16

[Fixes]
; Applies one transient scale to subtitle layout, wrapping, line spacing, and
; drawing. It never enlarges the game's stored subtitle box or position.
FixSubtitleScaling=1
SubtitleBaseHeight=720

[Diagnostics]
; Keep this on for troubleshooting. The log contains no personal data.
WriteLog=1
